name: Foundation contract validation

on:
  push:
    paths:
      - 'docs/contracts/**'
      - 'tools/contracts/**'
      - 'tests/contracts/**'
      - 'foundation/contracts/**'
      - 'shared/contracts/**'
      - 'models/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'docs/contracts/**'
      - 'tools/contracts/**'
      - 'tests/contracts/**'
      - 'foundation/contracts/**'
      - 'shared/contracts/**'
      - 'models/**'
      - '.github/workflows/contracts.yml'

jobs:
  validate:
    name: Validate Foundation Contract v0.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract tooling
        run: python -m pip install --disable-pip-version-check pyyaml openapi-spec-validator jsonschema
      - name: Validate OpenAPI 3.1 projection
        run: >-
          python -c "from pathlib import Path; import yaml; from openapi_spec_validator import validate;
          spec=yaml.safe_load(Path('docs/contracts/foundation.openapi.yaml').read_text(encoding='utf-8'));
          assert spec.get('openapi') == '3.1.0'; validate(spec)"
      - name: Validate behavioral fixtures
        run: python tools/contracts/validate_contract_fixtures.py --report contract-validation-report.json
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-contract-validation-report
          path: contract-validation-report.json
