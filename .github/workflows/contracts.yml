name: Foundation contract validation

on:
  push:
    paths:
      - 'docs/contracts/**'
      - 'tools/contracts/**'
      - 'tests/contracts/**'
      - 'foundation/contracts/**'
      - 'shared/contracts/**'
      - 'models/**'
      - '.github/workflows/contracts.yml'

  pull_request:
    branches:
      - master

jobs:
  validate:
    name: Validate Foundation Contract v0.1
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install contract tooling
        id: tooling
        run: python -m pip install --disable-pip-version-check -r tools/contracts/requirements.txt

      - name: Validate OpenAPI 3.1 projection
        run: >-
          python -c "from pathlib import Path; import yaml; from openapi_spec_validator import validate;
          spec=yaml.safe_load(Path('docs/contracts/foundation.openapi.yaml').read_text(encoding='utf-8'));
          assert spec.get('openapi') == '3.1.0'; validate(spec)"

      - name: Validate behavioral fixtures
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        run: python tools/contracts/validate_contract_fixtures.py --report contract-validation-report.json

      - name: Test contract validator failure handling
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        run: python -m unittest discover -s tests/contracts -v

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-contract-validation-report
          path: contract-validation-report.json
          if-no-files-found: error
