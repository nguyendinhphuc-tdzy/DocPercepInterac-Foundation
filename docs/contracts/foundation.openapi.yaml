openapi: 3.1.0
info:
  title: Document Processing Foundation Contract API
  version: 0.1.0
  description: >-
    Transport projection of Foundation architecture generation v2. This API
    exposes governed records and decisions. Controlled replay is an internal
    service and no direct document-mutation endpoint is exposed.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://foundation.invalid/api/v1
    description: Contract placeholder server
tags:
  - name: Governance
  - name: Analysis
  - name: Evidence
  - name: Authorization
  - name: Execution
  - name: Audit
paths:
  /tasks:
    get:
      tags: [Governance]
      operationId: listTasks
      responses:
        '200':
          description: Foundation tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPageFoundationTask'
    post:
      tags: [Governance]
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoundationTaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundationTask' }
  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Governance]
      operationId: getTask
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundationTask' }
  /documents:
    get:
      tags: [Governance]
      operationId: listDocuments
      responses:
        '200':
          description: Document artifacts and immutable versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageDocumentArtifact' }
  /analysis-runs:
    get:
      tags: [Analysis]
      operationId: listAnalysisRuns
      responses:
        '200':
          description: Analysis runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageAnalysisRun' }
    post:
      tags: [Analysis]
      operationId: createAnalysisRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalysisRunCreate' }
      responses:
        '202':
          description: Analysis accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRun' }
  /preflight-assessments:
    get:
      tags: [Analysis]
      operationId: listPreflightAssessments
      responses:
        '200':
          description: Immutable document preflight assessments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageDocumentPreflightAssessment' }
  /source-assessments:
    get:
      tags: [Evidence]
      operationId: listSourceAssessments
      responses:
        '200':
          description: Source assessments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageSourceAssessment' }
  /evidence:
    get:
      tags: [Evidence]
      operationId: listEvidence
      responses:
        '200':
          description: Evidence records and assessments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageEvidenceRecord' }
  /targets:
    get:
      tags: [Governance]
      operationId: listTargets
      responses:
        '200':
          description: Target contract instances and regions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageTargetRegion' }
  /mapping-proposals:
    get:
      tags: [Analysis]
      operationId: listMappingProposals
      responses:
        '200':
          description: Mapping proposals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageMappingProposal' }
  /change-proposals:
    get:
      tags: [Governance]
      operationId: listChangeProposals
      responses:
        '200':
          description: Change proposals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageChangeProposal' }
  /review-decisions:
    get:
      tags: [Authorization]
      operationId: listReviewDecisions
      responses:
        '200':
          description: Immutable human review decisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageReviewDecision' }
  /approved-change-sets:
    get:
      tags: [Authorization]
      operationId: listApprovedChangeSets
      responses:
        '200':
          description: Sealed authorization records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageApprovedChangeSet' }
  /executions:
    get:
      tags: [Execution]
      operationId: listExecutions
      description: Read-only execution projections. Replay dispatch is internal-only.
      responses:
        '200':
          description: Execution results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageExecutionResult' }
  /validation-reports:
    get:
      tags: [Execution]
      operationId: listValidationReports
      responses:
        '200':
          description: Independent validation reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageValidationReport' }
  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      responses:
        '200':
          description: Immutable audit events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPageAuditEvent' }
components:
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    ID:
      type: string
      minLength: 1
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    BusinessTargetID:
      type: string
      pattern: '^[A-Z][A-Z0-9_.]*$'
    SHA256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    SchemaVersion:
      type: string
      enum: ['0.1.0']
    Timestamp:
      type: string
      format: date-time
    DecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
    IntegerString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
    ContentRef:
      type: object
      additionalProperties: false
      required: [uri, sha256, media_type]
      properties:
        uri: { type: string, format: uri }
        sha256: { $ref: '#/components/schemas/SHA256' }
        media_type: { type: string, minLength: 1 }
    DocumentVersionRef:
      type: object
      additionalProperties: false
      required: [document_id, version_id, binary_hash]
      properties:
        document_id: { $ref: '#/components/schemas/ID' }
        version_id: { $ref: '#/components/schemas/ID' }
        binary_hash: { $ref: '#/components/schemas/SHA256' }
    Ref:
      type: object
      additionalProperties: false
      required: [object_type, object_id, revision]
      properties:
        object_type: { $ref: '#/components/schemas/ObjectType' }
        object_id: { $ref: '#/components/schemas/ID' }
        revision: { type: integer, minimum: 1 }
    Actor:
      type: object
      additionalProperties: false
      required: [actor_type, actor_id]
      properties:
        actor_type:
          type: string
          enum: [SYSTEM, HUMAN, AI, REPLAY_ENGINE, VALIDATOR]
        actor_id: { $ref: '#/components/schemas/ID' }
    ObjectType:
      type: string
      enum: [FoundationTask, DocumentArtifact, DocumentVersion, DocumentPreflightAssessment, PerceptionSnapshot, SemanticObject, NativeLocator, NativeBinding, TargetContractDefinition, TargetRegionDefinition, TargetContractInstance, TargetRegion, RulePack, BusinessRule, RuleEvaluation, FreshnessPolicy, SourceRequirement, SourceAssessment, EvidenceRecord, EvidenceCheck, EvidenceAssessment, MappingProposal, AIInteractionRecord, ChangeProposal, ReviewDecision, ApprovedChangeSet, ExecutionResult, ChangeExecutionResult, ValidationPlan, ValidationReport, ValidationCheckResult, ExceptionRecord, AnalysisRun, AuditEvent]
    ErrorCode:
      type: string
      enum: [INVALID_CONTRACT, INVALID_STATE_TRANSITION, REFERENCE_NOT_FOUND, EVALUATOR_BINDING_UNAVAILABLE, EVALUATOR_CONFIGURATION_MISMATCH, STALE_DOCUMENT_VERSION, LOCATOR_NOT_FOUND, LOCATOR_AMBIGUOUS, LOCATOR_FINGERPRINT_MISMATCH, CAPABILITY_UNKNOWN, UNSUPPORTED_NATIVE_OBJECT, PROTECTED_OBJECT, EXECUTION_UNSUPPORTED, STRICT_OOXML_MUTATION_UNQUALIFIED, SOURCE_MISSING, SOURCE_STALE, SOURCE_NOT_AUTHORITATIVE, SOURCE_CONFLICTING, SOURCE_AMBIGUOUS, EVIDENCE_INSUFFICIENT, EVIDENCE_NOT_VERIFIED, AI_AUTHORITY_VIOLATION, APPROVAL_REQUIRED, APPROVAL_CONTENT_MISMATCH, AUTHORIZATION_NOT_APPROVED, IDEMPOTENCY_CONFLICT, EXECUTION_CONFLICT, PRECONDITION_FAILED, REPLAY_ENGINE_FAILURE, INDEPENDENT_VALIDATOR_NOT_QUALIFIED, VALIDATION_OBSERVATION_UNAVAILABLE, UNAUTHORIZED_CHANGE_DETECTED, PROTECTED_SCOPE_VIOLATION, RELEASE_BLOCKED_INCOMPLETE_TARGETS, EVENT_INTEGRITY_MISMATCH, EVENT_CAUSATION_INVALID, UNSUPPORTED_FILE_FORMAT, ENCRYPTED_DOCUMENT, CORRUPTED_DOCUMENT, DOCUMENT_TOO_LARGE, MALWARE_DETECTED, PREFLIGHT_FAILED, PERCEPTION_FAILED, PERCEPTION_MISMATCH, SEMANTIC_OBJECT_NOT_FOUND, NATIVE_BINDING_MISSING, MAPPING_AMBIGUOUS, MAPPING_UNRESOLVED, AI_CONTEXT_INCOMPLETE, AI_OUTPUT_INVALID, AI_UNSUPPORTED_INFERENCE, AI_SERVICE_UNAVAILABLE, MUTATION_NOT_AUTHORIZED, POSTCONDITION_FAILED, SCHEMA_VALIDATION_FAILED, PACKAGE_DIFF_FAILED, INTRA_PART_DIFF_FAILED, SEMANTIC_REPERCEPTION_FAILED, BUSINESS_RECONCILIATION_FAILED]
    EventType:
      type: string
      enum: [TASK_CREATED, DOCUMENT_REGISTERED, DOCUMENT_PREFLIGHT_COMPLETED, PERCEPTION_COMPLETED, PERCEPTION_FAILED, NATIVE_BINDING_ASSESSED, ANALYSIS_COMPLETED, RULE_EVALUATED, SOURCE_ASSESSED, EVIDENCE_CHECKED, EVIDENCE_ASSESSED, MAPPING_PROPOSED, AI_INTERACTION_RECORDED, CHANGE_PROPOSED, REVIEW_DECIDED, SOURCE_REQUESTED, DECISION_SUPERSEDED, CHANGE_SET_APPROVED, APPROVAL_INVALIDATED, APPROVAL_REVOKED, REPLAY_REQUESTED, EXECUTION_COMPLETED, EXECUTION_REFUSED, VALIDATION_COMPLETED, RELEASE_ELIGIBILITY_CONFIRMED, RELEASE_WITHHELD, OUTPUT_QUARANTINED, OUTPUT_RELEASED, EXCEPTION_RECORDED, EXCEPTION_RESOLVED, STATUS_TRANSITIONED]
    Period:
      type: object
      additionalProperties: false
      required: [label, start_date, end_date]
      properties:
        label: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    EvaluatorBinding:
      type: object
      additionalProperties: false
      required: [evaluator_key, evaluator_version, configuration_ref]
      properties:
        evaluator_key: { type: string, minLength: 1 }
        evaluator_version: { type: string, minLength: 1 }
        configuration_ref: { $ref: '#/components/schemas/ContentRef' }
    BusinessValue:
      oneOf:
        - $ref: '#/components/schemas/TextBusinessValue'
        - $ref: '#/components/schemas/DecimalBusinessValue'
        - $ref: '#/components/schemas/IntegerBusinessValue'
        - $ref: '#/components/schemas/DateBusinessValue'
        - $ref: '#/components/schemas/BooleanBusinessValue'
        - $ref: '#/components/schemas/CurrencyBusinessValue'
        - $ref: '#/components/schemas/PercentBusinessValue'
        - $ref: '#/components/schemas/StructuredBusinessValue'
      discriminator:
        propertyName: kind
        mapping:
          TEXT: '#/components/schemas/TextBusinessValue'
          DECIMAL: '#/components/schemas/DecimalBusinessValue'
          INTEGER: '#/components/schemas/IntegerBusinessValue'
          DATE: '#/components/schemas/DateBusinessValue'
          BOOLEAN: '#/components/schemas/BooleanBusinessValue'
          CURRENCY: '#/components/schemas/CurrencyBusinessValue'
          PERCENT: '#/components/schemas/PercentBusinessValue'
          STRUCTURED: '#/components/schemas/StructuredBusinessValue'
    TextBusinessValue:
      type: object
      additionalProperties: false
      required: [kind, review_text, value]
      properties:
        kind: { const: TEXT }
        review_text: { type: string }
        value: { type: string }
    DecimalBusinessValue:
      type: object
      additionalProperties: false
      required: [kind, review_text, value]
      properties:
        kind: { const: DECIMAL }
        review_text: { type: string }
        value: { $ref: '#/components/schemas/DecimalString' }
    IntegerBusinessValue:
      type: object
      additionalProperties: false
      required: [kind, review_text, value]
      properties:
        kind: { const: INTEGER }
        review_text: { type: string }
        value: { $ref: '#/components/schemas/IntegerString' }
    DateBusinessValue:
      type: object
      additionalProperties: false
      required: [kind, review_text, value]
      properties:
        kind: { const: DATE }
        review_text: { type: string }
        value: { type: string, format: date }
    BooleanBusinessValue:
      type: object
      additionalProperties: false
      required: [kind, review_text, value]
      properties:
        kind: { const: BOOLEAN }
        review_text: { type: string }
        value: { type: boolean }
    CurrencyBusinessValue:
      type: object
      additionalProperties: false
      required: [kind, review_text, amount, currency_code]
      properties:
        kind: { const: CURRENCY }
        review_text: { type: string }
        amount: { $ref: '#/components/schemas/DecimalString' }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
    PercentBusinessValue:
      type: object
      additionalProperties: false
      required: [kind, review_text, percentage]
      properties:
        kind: { const: PERCENT }
        review_text: { type: string }
        percentage: { $ref: '#/components/schemas/DecimalString' }
    StructuredBusinessValue:
      type: object
      additionalProperties: false
      required: [kind, review_text, schema_ref, value]
      properties:
        kind: { const: STRUCTURED }
        review_text: { type: string }
        schema_ref: { $ref: '#/components/schemas/ContentRef' }
        value: { type: object }
    NativeElementPath:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [namespace_uri, local_name, ordinal]
        properties:
          namespace_uri: { type: string, format: uri }
          local_name: { type: string }
          ordinal: { type: integer, minimum: 1 }
    NativeAddress:
      oneOf:
        - $ref: '#/components/schemas/DocxContentControlAddress'
        - $ref: '#/components/schemas/DocxBookmarkAddress'
        - $ref: '#/components/schemas/DocxParagraphAddress'
        - $ref: '#/components/schemas/DocxRunAddress'
        - $ref: '#/components/schemas/DocxTableCellAddress'
        - $ref: '#/components/schemas/DocxRelationshipAddress'
        - $ref: '#/components/schemas/XlsxCellAddress'
        - $ref: '#/components/schemas/XlsxDefinedNameAddress'
        - $ref: '#/components/schemas/XlsxTableRangeAddress'
      discriminator:
        propertyName: kind
        mapping:
          DOCX_CONTENT_CONTROL: '#/components/schemas/DocxContentControlAddress'
          DOCX_BOOKMARK: '#/components/schemas/DocxBookmarkAddress'
          DOCX_PARAGRAPH: '#/components/schemas/DocxParagraphAddress'
          DOCX_RUN: '#/components/schemas/DocxRunAddress'
          DOCX_TABLE_CELL: '#/components/schemas/DocxTableCellAddress'
          DOCX_RELATIONSHIP: '#/components/schemas/DocxRelationshipAddress'
          XLSX_CELL: '#/components/schemas/XlsxCellAddress'
          XLSX_DEFINED_NAME: '#/components/schemas/XlsxDefinedNameAddress'
          XLSX_TABLE_RANGE: '#/components/schemas/XlsxTableRangeAddress'
    DocxContentControlAddress:
      type: object
      additionalProperties: false
      required: [kind, sdt_id, element_path]
      properties:
        kind: { const: DOCX_CONTENT_CONTROL }
        sdt_id: { type: string }
        element_path: { $ref: '#/components/schemas/NativeElementPath' }
    DocxBookmarkAddress:
      type: object
      additionalProperties: false
      required: [kind, bookmark_id, bookmark_name, start_path, end_path]
      properties:
        kind: { const: DOCX_BOOKMARK }
        bookmark_id: { type: string }
        bookmark_name: { type: string }
        start_path: { $ref: '#/components/schemas/NativeElementPath' }
        end_path: { $ref: '#/components/schemas/NativeElementPath' }
    DocxParagraphAddress:
      type: object
      additionalProperties: false
      required: [kind, paragraph_path]
      properties:
        kind: { const: DOCX_PARAGRAPH }
        paragraph_path: { $ref: '#/components/schemas/NativeElementPath' }
    DocxRunAddress:
      type: object
      additionalProperties: false
      required: [kind, run_path]
      properties:
        kind: { const: DOCX_RUN }
        run_path: { $ref: '#/components/schemas/NativeElementPath' }
    DocxTableCellAddress:
      type: object
      additionalProperties: false
      required: [kind, table_path, row_ordinal, cell_ordinal, cell_path]
      properties:
        kind: { const: DOCX_TABLE_CELL }
        table_path: { $ref: '#/components/schemas/NativeElementPath' }
        row_ordinal: { type: integer, minimum: 1 }
        cell_ordinal: { type: integer, minimum: 1 }
        cell_path: { $ref: '#/components/schemas/NativeElementPath' }
    DocxRelationshipAddress:
      type: object
      additionalProperties: false
      required: [kind, relationship_id, owner_part_uri]
      properties:
        kind: { const: DOCX_RELATIONSHIP }
        relationship_id: { type: string }
        owner_part_uri: { type: string }
    XlsxCellAddress:
      type: object
      additionalProperties: false
      required: [kind, sheet_id, cell_address]
      properties:
        kind: { const: XLSX_CELL }
        sheet_id: { type: string }
        cell_address: { type: string, pattern: '^[A-Z]{1,3}[1-9][0-9]*$' }
    XlsxDefinedNameAddress:
      type: object
      additionalProperties: false
      required: [kind, name, scope]
      properties:
        kind: { const: XLSX_DEFINED_NAME }
        name: { type: string }
        scope: { type: string, enum: [WORKBOOK, WORKSHEET] }
        scope_sheet_id: { type: string }
    XlsxTableRangeAddress:
      type: object
      additionalProperties: false
      required: [kind, range_kind, sheet_id, range_address]
      properties:
        kind: { const: XLSX_TABLE_RANGE }
        range_kind: { type: string, enum: [TABLE, RANGE] }
        sheet_id: { type: string }
        range_address: { type: string }
        table_id: { type: string }
        table_part_uri: { type: string }
    Condition:
      oneOf:
        - $ref: '#/components/schemas/BinaryHashEqualsCondition'
        - $ref: '#/components/schemas/TextEqualsCondition'
        - $ref: '#/components/schemas/ValueEqualsCondition'
        - $ref: '#/components/schemas/CapabilitySupportedCondition'
        - $ref: '#/components/schemas/EvidenceVerifiedCondition'
        - $ref: '#/components/schemas/PreserveScopeCondition'
      discriminator:
        propertyName: kind
        mapping:
          BINARY_HASH_EQUALS: '#/components/schemas/BinaryHashEqualsCondition'
          TEXT_EQUALS: '#/components/schemas/TextEqualsCondition'
          VALUE_EQUALS: '#/components/schemas/ValueEqualsCondition'
          CAPABILITY_SUPPORTED: '#/components/schemas/CapabilitySupportedCondition'
          EVIDENCE_VERIFIED: '#/components/schemas/EvidenceVerifiedCondition'
          PRESERVE_SCOPE: '#/components/schemas/PreserveScopeCondition'
    ConditionTarget:
      oneOf:
        - $ref: '#/components/schemas/InputNativeObjectTarget'
        - $ref: '#/components/schemas/OutputApprovedChangeTarget'
      discriminator:
        propertyName: kind
        mapping:
          INPUT_NATIVE_OBJECT: '#/components/schemas/InputNativeObjectTarget'
          OUTPUT_APPROVED_CHANGE: '#/components/schemas/OutputApprovedChangeTarget'
    BinaryHashEqualsCondition:
      type: object
      additionalProperties: false
      required: [condition_id, kind, document_version_ref, expected_binary_hash]
      properties:
        condition_id: { $ref: '#/components/schemas/ID' }
        kind: { const: BINARY_HASH_EQUALS }
        document_version_ref: { $ref: '#/components/schemas/DocumentVersionRef' }
        expected_binary_hash: { $ref: '#/components/schemas/SHA256' }
    TextEqualsCondition:
      type: object
      additionalProperties: false
      required: [condition_id, kind, target, expected_text]
      properties:
        condition_id: { $ref: '#/components/schemas/ID' }
        kind: { const: TEXT_EQUALS }
        target: { $ref: '#/components/schemas/ConditionTarget' }
        expected_text: { type: string }
    ValueEqualsCondition:
      type: object
      additionalProperties: false
      required: [condition_id, kind, target, expected_value, value_reader_policy_ref]
      properties:
        condition_id: { $ref: '#/components/schemas/ID' }
        kind: { const: VALUE_EQUALS }
        target: { $ref: '#/components/schemas/ConditionTarget' }
        expected_value: { $ref: '#/components/schemas/BusinessValue' }
        value_reader_policy_ref: { $ref: '#/components/schemas/ContentRef' }
    CapabilitySupportedCondition:
      type: object
      additionalProperties: false
      required: [condition_id, kind, native_locator_ref, capability_result_ref, operation, engine, engine_version, conformance]
      properties:
        condition_id: { $ref: '#/components/schemas/ID' }
        kind: { const: CAPABILITY_SUPPORTED }
        native_locator_ref: { $ref: '#/components/schemas/Ref' }
        capability_result_ref: { $ref: '#/components/schemas/CapabilityResultRef' }
        operation: { type: string }
        engine: { type: string }
        engine_version: { type: string }
        conformance: { type: string }
    EvidenceVerifiedCondition:
      type: object
      additionalProperties: false
      required: [condition_id, kind, evidence_assessment_ref, business_target_id]
      properties:
        condition_id: { $ref: '#/components/schemas/ID' }
        kind: { const: EVIDENCE_VERIFIED }
        evidence_assessment_ref: { $ref: '#/components/schemas/Ref' }
        business_target_id: { $ref: '#/components/schemas/BusinessTargetID' }
    PreserveScopeCondition:
      type: object
      additionalProperties: false
      required: [condition_id, kind, protected_scope]
      properties:
        condition_id: { $ref: '#/components/schemas/ID' }
        kind: { const: PRESERVE_SCOPE }
        protected_scope: { $ref: '#/components/schemas/ProtectedScope' }
    InputNativeObjectTarget:
      type: object
      additionalProperties: false
      required: [kind, native_locator_ref]
      properties:
        kind: { const: INPUT_NATIVE_OBJECT }
        native_locator_ref: { $ref: '#/components/schemas/Ref' }
    OutputApprovedChangeTarget:
      type: object
      additionalProperties: false
      required: [kind, approved_change_id]
      properties:
        kind: { const: OUTPUT_APPROVED_CHANGE }
        approved_change_id: { $ref: '#/components/schemas/ID' }
    MutationPayload:
      oneOf:
        - $ref: '#/components/schemas/RunTextReplacementPayload'
        - $ref: '#/components/schemas/SdtTextReplacementPayload'
        - $ref: '#/components/schemas/SimpleTableCellTextReplacementPayload'
      discriminator:
        propertyName: kind
        mapping:
          RUN_TEXT_REPLACEMENT: '#/components/schemas/RunTextReplacementPayload'
          SDT_TEXT_REPLACEMENT: '#/components/schemas/SdtTextReplacementPayload'
          SIMPLE_TABLE_CELL_TEXT_REPLACEMENT: '#/components/schemas/SimpleTableCellTextReplacementPayload'
    RunTextReplacementPayload:
      type: object
      additionalProperties: false
      required: [kind, replacement_text]
      properties:
        kind: { const: RUN_TEXT_REPLACEMENT }
        replacement_text: { type: string }
    SdtTextReplacementPayload:
      type: object
      additionalProperties: false
      required: [kind, replacement_text]
      properties:
        kind: { const: SDT_TEXT_REPLACEMENT }
        replacement_text: { type: string }
    SimpleTableCellTextReplacementPayload:
      type: object
      additionalProperties: false
      required: [kind, replacement_text]
      properties:
        kind: { const: SIMPLE_TABLE_CELL_TEXT_REPLACEMENT }
        replacement_text: { type: string }
    ProtectedScope:
      type: object
      additionalProperties: false
      required: [document_version_ref, protected_locator_refs, preserve_outside_approved_changes]
      properties:
        document_version_ref: { $ref: '#/components/schemas/DocumentVersionRef' }
        protected_locator_refs:
          type: array
          items: { $ref: '#/components/schemas/Ref' }
        preserve_outside_approved_changes: { const: true }
        serialization_allowance_ref: { $ref: '#/components/schemas/ContentRef' }
    ValidationRequirement:
      type: object
      additionalProperties: false
      required: [requirement_id, kind, mandatory, business_target_ids, description]
      properties:
        requirement_id: { $ref: '#/components/schemas/ID' }
        kind: { type: string }
        mandatory: { type: boolean }
        business_target_ids:
          type: array
          items: { $ref: '#/components/schemas/BusinessTargetID' }
        description: { type: string }
    CapabilityResultRef:
      type: object
      additionalProperties: false
      required: [preflight_assessment_ref, capability_result_id]
      properties:
        preflight_assessment_ref: { $ref: '#/components/schemas/Ref' }
