[pytest]
# `pytest foundation -q` is deterministic: foundation/conftest.py pins the test
# environment (local storage + local database, live credentials blanked) before
# config.py is imported, so a developer's .env never decides what the suite tests.
testpaths = tests
markers =
    live_supabase: needs a real Supabase project (run with FOUNDATION_LIVE_TESTS=1)
    live_gemini: needs a real Gemini API key (run with FOUNDATION_LIVE_TESTS=1)
